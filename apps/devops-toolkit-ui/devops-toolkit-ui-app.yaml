apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-toolkit-ui
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd-autopilot
    app.kubernetes.io/name: devops-toolkit-ui
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: oci://ghcr.io/vfarcic/dot-ai-ui/charts/dot-ai-ui
    chart: dot-ai-ui
    targetRevision: 0.15.0
    helm:
      valuesObject:
        # Connection to dot-ai MCP server
        dotAi:
          url: "http://devops-toolkit-dot-ai.devops-toolkit.svc.cluster.local:3456"
          auth:
            # Uses the same secret as the MCP server
            secretRef:
              name: dot-ai-secrets
              key: auth-token
        
        # UI Authentication
        # NOTE: Create the secret manually before deploying:
        # kubectl create secret generic dot-ai-ui-secrets -n devops-toolkit \
        #   --from-literal=ui-auth-token="$(openssl rand -base64 32)"
        uiAuth:
          secretRef:
            name: dot-ai-ui-secrets
            key: ui-auth-token
        
        # Disable traditional Ingress
        ingress:
          enabled: false
        
        # Gateway API configuration
        gateway:
          enabled: true
          name: "technovise-gateway"
          namespace: "istio-ingress"
          listeners:
            https:
              hostname: "devops-toolkit-ui.technovise.local"
        
        # Resources
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
  
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-toolkit
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
