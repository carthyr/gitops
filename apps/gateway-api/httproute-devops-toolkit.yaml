apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devops-toolkit
  namespace: devops-toolkit
spec:
  parentRefs:
  - name: technovise-gateway
    namespace: istio-ingress
  hostnames:
  - "devops-toolkit.technovise.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: devops-toolkit-dot-ai
      port: 3456
    timeouts:
      request: 3600s
      backendRequest: 3600s
