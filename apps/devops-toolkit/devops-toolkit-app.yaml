apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-toolkit
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd-autopilot
    app.kubernetes.io/name: devops-toolkit
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://ghcr.io/vfarcic/dot-ai/charts
    chart: dot-ai
    targetRevision: 0.168.0
    helm:
      valuesObject:
        # Deployment method
        deployment:
          method: standard
        
        # Disable traditional Ingress
        ingress:
          enabled: false
        
        # Reference existing Gateway (RECOMMENDED)
        gateway:
          name: "technovise-gateway"
          namespace: "istio-ingress"
          listeners:
            https:
              hostname: "devops-toolkit.technovise.local"
          timeouts:
            request: "3600s"
            backendRequest: "3600s"
        
        # Secrets configuration
        # NOTE: Create the secret manually before deploying:
        # kubectl create secret generic dot-ai-secrets -n devops-toolkit \
        #   --from-literal=auth-token="$(openssl rand -base64 32)" \
        #   --from-literal=anthropic-api-key="YOUR_ANTHROPIC_KEY" \
        #   --from-literal=openai-api-key="YOUR_OPENAI_KEY"
        secrets:
          name: dot-ai-secrets
          # Leave these empty - values will come from the manually created secret
          auth:
            token: ""
          anthropic:
            apiKey: ""
          openai:
            apiKey: ""
        
        # AI provider configuration
        ai:
          provider: anthropic
        
        # Qdrant vector database
        qdrant:
          enabled: true
        
        # Local embeddings
        localEmbeddings:
          enabled: true
        
        # Resources
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
  
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-toolkit
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
