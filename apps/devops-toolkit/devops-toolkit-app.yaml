apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-toolkit
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd-autopilot
    app.kubernetes.io/name: devops-toolkit
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: oci://ghcr.io/vfarcic/dot-ai/charts/dot-ai
    chart: dot-ai
    targetRevision: 0.168.0
    helm:
      valuesObject:
        # Deployment method
        deployment:
          method: standard
        
        # Disable traditional Ingress
        ingress:
          enabled: false
        
        # Reference existing Gateway (RECOMMENDED)
        gateway:
          name: "technovise-gateway"
          namespace: "istio-ingress"
          listeners:
            https:
              hostname: "devops-toolkit.technovise.local"
          timeouts:
            request: "3600s"
            backendRequest: "3600s"
        
        # Secrets configuration
        # NOTE: Create the secret manually before deploying:
        # kubectl create secret generic dot-ai-secrets -n devops-toolkit \
        #   --from-literal=auth-token="$(openssl rand -base64 32)" \
        #   --from-literal=custom-llm-api-key="ollama" \
        #   --from-literal=custom-embeddings-api-key="local-embeddings-no-key-required"
        secrets:
          name: dot-ai-secrets
          # Leave these empty - values will come from the manually created secret
          auth:
            token: ""
          customLlm:
            apiKey: ""
        
        # AI provider configuration - using local Ollama with qwen3.6:27b
        # Per official docs: set provider to "openai" for OpenAI-compatible endpoints like Ollama
        ai:
          provider: openai
          model: "qwen3.6:27b"
          customEndpoint:
            enabled: true
            baseURL: "http://ollama.ollama.svc.cluster.local:11434/v1"
            embeddingsBaseURL: "http://devops-toolkit-local-embeddings.devops-toolkit.svc.cluster.local:80"
            embeddingsDimensions: "384"
        
        # Qdrant vector database
        qdrant:
          enabled: true
        
        # Local embeddings: deployed via separate manifest at
        # apps/devops-toolkit/manifests/local-embeddings.yaml
        # (Helm chart's localEmbeddings.enabled was not rendering reliably via ArgoCD;
        # we manage the TEI Deployment/Service directly and configure via customEndpoint.embeddingsBaseURL above.)
        localEmbeddings:
          enabled: false
        
        # Web UI integration
        webUI:
          baseUrl: "https://devops-toolkit-ui.technovise.local"
        
        # Resources
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
  
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-toolkit
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
