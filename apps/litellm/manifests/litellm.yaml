---
apiVersion: v1
kind: Namespace
metadata:
  name: litellm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    # LiteLLM Proxy Configuration for Ollama Backend
    
    model_list:
      # Primary coding model - Qwen2.5-Coder 7B
      - model_name: qwen-coder
        litellm_params:
          model: ollama/qwen2.5-coder:7b
          api_base: http://ollama.ollama.svc.cluster.local:11434
          stream: true
          timeout: 300
      
      # Alias with version for explicit calls
      - model_name: qwen2.5-coder-7b
        litellm_params:
          model: ollama/qwen2.5-coder:7b
          api_base: http://ollama.ollama.svc.cluster.local:11434
          stream: true
          timeout: 300
      
      # Smaller Qwen model if available
      - model_name: qwen-coder-1.5b
        litellm_params:
          model: ollama/qwen2.5-coder:1.5b-base
          api_base: http://ollama.ollama.svc.cluster.local:11434
          stream: true
          timeout: 300
      
      # Llama 3.2 for general tasks
      - model_name: llama3.2
        litellm_params:
          model: ollama/llama3.2:latest
          api_base: http://ollama.ollama.svc.cluster.local:11434
          stream: true
          timeout: 300
    
    # General settings
    general_settings:
      master_key: "sk-1234"  # dummy key for single-user setup
      
      # Disable auth for health checks
      public_routes: ["/health", "/health/readiness", "/health/liveliness"]
      
      # Logging
      json_logs: true
      
      # Success callbacks for monitoring
      success_callback: []
      
      # Disable database (not needed for single user)
      use_client: false
    
    # Router settings (for future multi-model routing)
    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 300
    
    # Litellm settings
    litellm_settings:
      drop_params: true  # drop unsupported params instead of erroring
      json_logs: true
      request_timeout: 300
      telemetry: false  # disable telemetry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: litellm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      serviceAccountName: litellm
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
          protocol: TCP
        env:
        - name: LITELLM_MODE
          value: "PRODUCTION"
        - name: LITELLM_LOG
          value: "INFO"
        - name: STORE_MODEL_IN_DB
          value: "False"
        args:
        - "--config"
        - "/app/config/config.yaml"
        - "--port"
        - "4000"
        - "--host"
        - "0.0.0.0"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: litellm
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: litellm
spec:
  parentRefs:
    - name: technovise-gateway
      namespace: istio-ingress
  hostnames:
    - "ai.technovise.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm
          port: 4000
