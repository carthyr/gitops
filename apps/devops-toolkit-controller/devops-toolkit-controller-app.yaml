apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-toolkit-controller
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd-autopilot
    app.kubernetes.io/name: devops-toolkit-controller
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: oci://ghcr.io/vfarcic/dot-ai-controller/charts/dot-ai-controller
    chart: dot-ai-controller
    targetRevision: 0.9.0
    helm:
      valuesObject:
        # Controller resources
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Enable all CRDs
        crds:
          install: true
  
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-toolkit
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
